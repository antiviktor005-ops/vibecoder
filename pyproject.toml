[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeworker-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4", "SQLAlchemy[asyncio]>=2.0.40,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "openai>=1.85,<3",
  "APScheduler>=3.11,<4", "httpx>=0.28,<0.29", "feedparser>=6.0.11,<7",
  "Jinja2>=3.1.6,<4", "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.generator" = ["templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
