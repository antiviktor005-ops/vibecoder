<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<title>{{ site.title }}</title><link rel="stylesheet" href="style.css"><script defer src="site.js"></script></head>
<body class="{{ site.theme }}"><header><nav aria-label="Разделы">{% for section in site.sections %}
<a href="#s{{ loop.index }}">{{ section.heading }}</a>{% endfor %}</nav>
<h1>{{ site.title }}</h1><p>{{ site.intro }}</p></header>
<main>{% for section in site.sections %}<section id="s{{ loop.index }}"><h2>{{ section.heading }}</h2>
<p>{{ section.text }}</p></section>{% endfor %}</main>
<footer><a href="#top" id="top-link">Наверх ↑</a></footer></body></html>
